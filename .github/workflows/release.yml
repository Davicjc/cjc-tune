name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Build the packages (AppImage, .deb, .rpm) and publish the release ────
  build:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libpulse-dev

      - run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Name the files without spaces
        run: |
          cd src-tauri/target/release/bundle
          for f in appimage/*.AppImage deb/*.deb rpm/*.rpm; do
            [ -e "$f" ] || continue
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed 's/^CJC Tune/cjc-tune/; s/ /-/g')"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v ver="$VERSION" '/^## \[/ { if (p) { exit } } $0 ~ ("^## \\[" ver "\\]") { p=1; next } p { print }' CHANGELOG.md > release_notes.md
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          body_path: ${{ steps.release_notes.outputs.notes_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
